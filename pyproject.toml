[project]
name = "silkscreen"
version = "0.1.0"
description = "Agentic PCB design: datasheet to placed board, with the reasoning shown."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "ortools>=9.10",
    "kiutils>=1.4.8",
]

[project.optional-dependencies]
# The engine is model-free; agents/ is the only place a network call lives.
agents = ["google-genai>=1.0", "pypdf>=4.0"]
cloud = ["google-genai>=1.0", "google-cloud-firestore>=2.16"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
silkscreen-mcp = "silkscreen.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "service/tests"]
norecursedirs = ["vendor", ".venv", "frontend", "web", "node_modules"]
pythonpath = ["engine", "."]

[tool.ruff]
line-length = 88
# Vendored third-party code is not ours to reformat.
exclude = ["vendor"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
